# Render blueprint — deploys the Streamlit app as a free web service.
# In Render: New +  ->  Blueprint  ->  point at the repo containing this file.
services:
  - type: web
    name: greek-pension-strategy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false
    autoDeploy: true
